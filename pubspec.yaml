name: tuu_app2app
description: Cliente Flutter para integración app-to-app con TUU (ex-Haulmer) Pagos vía Android Intent.
version: 0.4.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: cl.mufin.tuu_app2app
        pluginClass: TuuApp2appPlugin
